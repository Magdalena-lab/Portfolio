<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Projects in the Works</title>
  <link href='https://fonts.googleapis.com/css?family=Urbanist' rel='stylesheet'>

  <style>
    body {
      font-family: 'Urbanist';
      font-size: 1.5em;;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    .container {
      max-width: 1300px;
      width: 95%;
      background: white;
      padding: 40px;
      margin: 40px auto;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: justify;
    }
     h1 {
      color: #1c0266;
      margin-bottom: 20px;
      text-align: center;
    }
    
    h2 {
      font-size: 1.2em;
      color: #000;
      line-height: 1.6;
      font-style: italic;
      font-weight: bold; 
      margin-bottom: 20px;
      text-align: center;
    }
    img {
      width: 90%;
      height: auto;
      margin: 40px;
    }
    video {
      max-width: 80%;
      margin: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    p {
      margin-bottom: 15px;
      line-height: 1.6;
      margin-top: 15px;
     }
    ul {
      text-align: justify;
      margin-left: 20px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Urbanist";
    }

    body {
      background: #f8f9fa;
      color: #333;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      width: 100%;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 100;
  }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    nav a {
      margin-left: 25px;
      font-size: 20px;
      opacity: .7;
      position: relative;
      padding-bottom: 4px;
      transition: opacity .2s;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0%;
      height: 2px;
      background: #1c0266;
      transition: width .25s;
    }

    nav a:hover,
    nav a.active {
      opacity: 1;
      font-weight: bold;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

  </style>
</head>
<body>

  <header>
  <a href="../index.html" class="logo">Magdalena</a>
  <nav>
    <a href="../index.html" class="active">Home</a>
  </nav>
</header>

  <div class="container">
    <h1>Projects in the Work</h1>
   
    <h2> Project 1. A Power BI dashboard exploring labor-market trends and open job patterns in Finland.</h2>
   
    <h2>Project 2. ETL pipeline analyzing Reddit discussions and trends to track player sentiment and topics over time.</h2>
  
  </div>
</body>
</html>
